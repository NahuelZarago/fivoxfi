{% extends "base_app.html" %}
{% block title %}Punto de venta{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold">Punto de venta</h1>
    <span class="text-sm text-gray-500">Operador: <strong>{{ current_user.username }}</strong></span>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2 space-y-4">
        <div class="bg-white rounded-2xl border border-gray-200 p-4">
            <input type="search" id="searchInput" placeholder="Buscar por nombre o SKU..." autocomplete="off" aria-label="Buscar producto"
                   class="w-full border border-gray-300 rounded-xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-green-500">
            <div id="searchResults" class="mt-2 hidden border border-gray-200 rounded-xl overflow-hidden divide-y divide-gray-100"></div>
        </div>
        <div class="bg-white rounded-2xl border border-gray-200 p-4">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Productos disponibles</p>
            <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-96 overflow-y-auto"></div>
        </div>
    </div>

    <div class="bg-white rounded-2xl border border-gray-200 flex flex-col h-fit lg:sticky lg:top-6">
        <div class="p-4 border-b border-gray-100"><h2 class="font-semibold">Carrito</h2></div>
        <div id="cartItems" class="p-4 space-y-1 min-h-32"></div>
        <div class="p-4 border-t border-gray-100 space-y-4">
            <div class="flex items-center justify-between text-lg font-bold">
                <span>Total</span><span id="cartTotal" class="text-green-700">$0,00</span>
            </div>
            <div>
                <label for="paymentMethod" class="block text-xs font-medium text-gray-600 mb-1">Medio de pago</label>
                <select id="paymentMethod" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                    {% for key, label in methods %}<option value="{{ key }}">{{ label }}</option>{% endfor %}
                </select>
            </div>
            <p id="errorBox" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-xl px-3 py-2" role="alert"></p>
            <button id="checkoutBtn" type="button" disabled
                    class="w-full bg-green-600 text-white font-semibold py-3 rounded-xl hover:bg-green-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">Confirmar venta</button>
            <button id="clearBtn" type="button" class="w-full border border-gray-200 text-gray-500 text-sm py-2 rounded-xl hover:bg-gray-50">Limpiar carrito</button>
        </div>
    </div>
</div>

<div id="successModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50" role="dialog" aria-modal="true" aria-labelledby="successTitle">
    <div class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4 text-center">
        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl text-green-600" aria-hidden="true">✓</div>
        <h3 id="successTitle" class="text-xl font-bold mb-2">¡Venta registrada!</h3>
        <p id="successMsg" class="text-gray-500 text-sm mb-6"></p>
        <button id="newSaleBtn" type="button" class="bg-green-600 text-white font-semibold px-8 py-2.5 rounded-xl hover:bg-green-700">Nueva venta</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script id="initial-products" type="application/json">{{ products|tojson }}</script>
<script>
(function () {
    'use strict';
    // Todo el texto que viene de la base se inserta con textContent (nunca innerHTML):
    // un nombre de producto como <img onerror=...> no puede ejecutar código.
    var csrf = document.querySelector('meta[name="csrf-token"]').content;
    var products = JSON.parse(document.getElementById('initial-products').textContent);
    var cart = {};          // id -> {id, name, price (centavos), stock, qty}
    var sending = false;

    function toCents(str) { return Math.round(parseFloat(str) * 100); }
    function money(cents) {
        var s = (cents / 100).toFixed(2).split('.');
        return '$' + s[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + s[1];
    }
    function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
    }
    function showError(msg) {
        var box = document.getElementById('errorBox');
        box.textContent = msg || '';
        box.classList.toggle('hidden', !msg);
    }

    function productButton(p) {
        var b = el('button', 'text-left p-3 rounded-xl border border-gray-200 hover:border-green-400 hover:bg-green-50 transition-colors');
        b.type = 'button';
        b.appendChild(el('p', 'text-sm font-medium truncate', p.name));
        b.appendChild(el('p', 'text-sm font-bold text-green-700 mt-0.5', money(toCents(p.price))));
        b.appendChild(el('p', 'text-xs text-gray-400 mt-0.5', 'Stock: ' + p.stock));
        b.addEventListener('click', function () { addToCart(p); });
        return b;
    }

    function renderGrid() {
        var grid = document.getElementById('productGrid');
        grid.replaceChildren();
        if (!products.length) grid.appendChild(el('p', 'text-sm text-gray-400 col-span-full', 'No hay productos con stock.'));
        products.forEach(function (p) { grid.appendChild(productButton(p)); });
    }

    function addToCart(p) {
        showError('');
        var line = cart[p.id];
        if (line) {
            if (line.qty >= line.stock) { showError('Stock máximo alcanzado para "' + p.name + '" (' + line.stock + ').'); return; }
            line.qty += 1;
        } else {
            cart[p.id] = { id: p.id, name: p.name, price: toCents(p.price), stock: p.stock, qty: 1 };
        }
        renderCart();
    }

    function changeQty(id, delta) {
        var line = cart[id];
        if (!line) return;
        if (delta > 0 && line.qty >= line.stock) { showError('Stock máximo alcanzado para "' + line.name + '".'); return; }
        line.qty += delta;
        if (line.qty <= 0) delete cart[id];
        showError('');
        renderCart();
    }

    function qtyButton(label, aria, fn) {
        var b = el('button', 'w-7 h-7 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-100 text-sm font-bold', label);
        b.type = 'button'; b.setAttribute('aria-label', aria); b.addEventListener('click', fn);
        return b;
    }

    function renderCart() {
        var box = document.getElementById('cartItems');
        var lines = Object.values(cart), total = 0;
        box.replaceChildren();
        if (!lines.length) box.appendChild(el('p', 'text-sm text-gray-400 text-center py-8', 'El carrito está vacío'));
        lines.forEach(function (l) {
            total += l.price * l.qty;
            var row = el('div', 'flex items-center gap-2 py-2 border-b border-gray-50');
            var info = el('div', 'flex-1 min-w-0');
            info.appendChild(el('p', 'text-sm font-medium truncate', l.name));
            info.appendChild(el('p', 'text-xs text-gray-500', money(l.price) + ' c/u'));
            var qty = el('div', 'flex items-center gap-1');
            qty.appendChild(qtyButton('−', 'Quitar una unidad de ' + l.name, function () { changeQty(l.id, -1); }));
            qty.appendChild(el('span', 'w-8 text-center text-sm font-semibold', String(l.qty)));
            qty.appendChild(qtyButton('+', 'Agregar una unidad de ' + l.name, function () { changeQty(l.id, 1); }));
            row.appendChild(info); row.appendChild(qty);
            row.appendChild(el('p', 'text-sm font-bold w-20 text-right', money(l.price * l.qty)));
            box.appendChild(row);
        });
        document.getElementById('cartTotal').textContent = money(total);
        document.getElementById('checkoutBtn').disabled = !lines.length || sending;
    }

    function clearCart() { cart = {}; showError(''); renderCart(); }

    async function checkout() {
        var items = Object.values(cart).map(function (l) { return { product_id: l.id, quantity: l.qty }; });
        if (!items.length || sending) return;
        sending = true; showError('');
        var btn = document.getElementById('checkoutBtn');
        btn.disabled = true; btn.textContent = 'Procesando...';
        try {
            var res = await fetch('/app/pos/api/sale', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf },
                body: JSON.stringify({ payment_method: document.getElementById('paymentMethod').value, items: items })
            });
            var data = await res.json().catch(function () { return {}; });
            if (res.ok && data.success) {
                document.getElementById('successMsg').textContent = data.message;
                var m = document.getElementById('successModal');
                m.classList.remove('hidden'); m.classList.add('flex');
                document.getElementById('newSaleBtn').focus();
            } else {
                showError(data.error || 'No se pudo registrar la venta.');
            }
        } catch (e) {
            showError('Error de conexión. Verificá tu internet y reintentá (revisá el historial por si la venta ya se registró).');
        } finally {
            sending = false; btn.textContent = 'Confirmar venta'; renderCart();
        }
    }

    function closeModal() {
        var m = document.getElementById('successModal');
        m.classList.add('hidden'); m.classList.remove('flex');
        window.location.reload();   // Trae el stock actualizado
    }

    var timer, searchSeq = 0;
    document.getElementById('searchInput').addEventListener('input', function () {
        clearTimeout(timer);
        var q = this.value.trim(), box = document.getElementById('searchResults');
        if (!q) { box.classList.add('hidden'); return; }
        timer = setTimeout(async function () {
            var seq = ++searchSeq;
            try {
                var res = await fetch('/app/pos/api/products/search?q=' + encodeURIComponent(q));
                if (!res.ok || seq !== searchSeq) return;   // Descarta respuestas viejas
                var list = await res.json();
                box.replaceChildren(); box.classList.remove('hidden');
                if (!list.length) { box.appendChild(el('p', 'px-4 py-3 text-sm text-gray-400', 'Sin resultados')); return; }
                list.forEach(function (p) {
                    var b = el('button', 'w-full flex items-center justify-between px-4 py-3 hover:bg-gray-50 text-left');
                    b.type = 'button';
                    var left = el('div');
                    left.appendChild(el('p', 'text-sm font-medium', p.name));
                    left.appendChild(el('p', 'text-xs text-gray-400', 'SKU: ' + (p.sku || '—') + ' · Stock: ' + p.stock));
                    b.appendChild(left);
                    b.appendChild(el('p', 'text-sm font-bold text-green-700', money(toCents(p.price))));
                    b.addEventListener('click', function () {
                        addToCart(p);
                        document.getElementById('searchInput').value = '';
                        box.classList.add('hidden');
                    });
                    box.appendChild(b);
                });
            } catch (e) { /* sin acción */ }
        }, 200);
    });

    document.getElementById('checkoutBtn').addEventListener('click', checkout);
    document.getElementById('clearBtn').addEventListener('click', clearCart);
    document.getElementById('newSaleBtn').addEventListener('click', closeModal);
    renderGrid(); renderCart();
})();
</script>
{% endblock %}
