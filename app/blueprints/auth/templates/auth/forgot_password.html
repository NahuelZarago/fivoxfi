{% extends 'base_auth.html' %}
{% block title %}Recuperar contraseña{% endblock %}
{% block content %}
<div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-8">
    <h2 class="text-lg font-bold text-gray-900 mb-2">¿Olvidaste tu contraseña?</h2>
    <p class="text-sm text-gray-500 mb-6">Ingresá tu email y te enviamos un enlace para elegir una nueva.</p>
    <form method="POST" class="space-y-4">
        {{ csrf_input() }}
        <input type="email" name="email" required autofocus autocomplete="email" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50" placeholder="tu@email.com" aria-label="Email">
        <button type="submit" class="w-full bg-green-600 text-white font-semibold py-3 rounded-xl hover:bg-green-700 transition-colors text-sm">Enviar enlace</button>
    </form>
    <p class="text-center text-sm mt-6"><a href="{{ url_for('auth.login') }}" class="text-green-700 hover:underline">Volver a iniciar sesión</a></p>
</div>
{% endblock %}
