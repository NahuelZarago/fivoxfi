{% extends 'base_auth.html' %}
{% block title %}Crear mi negocio{% endblock %}
{% block content %}
<div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-8">
    <h2 class="text-lg font-bold text-gray-900 mb-2">Registrá tu empresa</h2>
    <p class="text-sm text-gray-500 mb-6">Vas a recibir un código para invitar a tus empleados y otro para tus clientes.</p>
    <form method="POST" class="space-y-4">
        {{ csrf_input() }}
        <div>
            <label for="business_name" class="block text-sm font-medium text-gray-700 mb-1.5">Nombre del negocio</label>
            <input id="business_name" name="business_name" required autofocus maxlength="120" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50">
        </div>
        <button type="submit" class="w-full bg-green-600 text-white font-semibold py-3 rounded-xl hover:bg-green-700 transition-colors text-sm">Crear negocio</button>
    </form>
    <p class="text-center text-sm mt-6"><a href="{{ url_for('auth.choose_role') }}" class="text-gray-500 hover:underline">Volver</a></p>
</div>
{% endblock %}
