{% extends 'base_auth.html' %}
{% block title %}Crear cuenta{% endblock %}
{% block subtitle %}<p class="text-gray-500 text-sm">Creá tu cuenta para empezar</p>{% endblock %}
{% block content %}
<div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-8">
    <h2 class="text-lg font-bold text-gray-900 mb-6">Crear cuenta</h2>
    <form method="POST" class="space-y-4">
        {{ csrf_input() }}
        <div>
            <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5">Tu nombre</label>
            <input id="username" name="username" required maxlength="80" autocomplete="name" value="{{ form.get('username', '') }}" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50">
        </div>
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
            <input id="email" type="email" name="email" required maxlength="120" autocomplete="email" value="{{ form.get('email', '') }}" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50">
        </div>
        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Contraseña</label>
            <input id="password" type="password" name="password" required minlength="8" maxlength="128" autocomplete="new-password" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50">
            <p class="text-xs text-gray-400 mt-1">Mínimo 8 caracteres, con letras y números.</p>
        </div>
        <div>
            <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1.5">Repetir contraseña</label>
            <input id="confirm_password" type="password" name="confirm_password" required autocomplete="new-password" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50">
        </div>
        <button type="submit" class="w-full bg-green-600 text-white font-semibold py-3 rounded-xl hover:bg-green-700 transition-colors text-sm">Crear cuenta</button>
    </form>
    <p class="text-center text-sm text-gray-500 mt-6">
        ¿Ya tenés cuenta? <a href="{{ url_for('auth.login') }}" class="text-green-700 font-semibold hover:underline">Iniciar sesión</a>
    </p>
</div>
{% endblock %}
