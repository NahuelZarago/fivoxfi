{% extends 'base_auth.html' %}
{% block title %}Nueva contraseña{% endblock %}
{% block content %}
<div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-8">
    <h2 class="text-lg font-bold text-gray-900 mb-6">Elegí una nueva contraseña</h2>
    <form method="POST" class="space-y-4">
        {{ csrf_input() }}
        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Nueva contraseña</label>
            <input id="password" type="password" name="password" required minlength="8" maxlength="128" autocomplete="new-password" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50">
            <p class="text-xs text-gray-400 mt-1">Mínimo 8 caracteres, con letras y números.</p>
        </div>
        <div>
            <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1.5">Repetir contraseña</label>
            <input id="confirm_password" type="password" name="confirm_password" required autocomplete="new-password" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50">
        </div>
        <button type="submit" class="w-full bg-green-600 text-white font-semibold py-3 rounded-xl hover:bg-green-700 transition-colors text-sm">Guardar contraseña</button>
    </form>
</div>
{% endblock %}
