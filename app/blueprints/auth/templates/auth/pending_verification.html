{% extends 'base_auth.html' %}
{% block title %}Verificá tu email{% endblock %}
{% block content %}
<div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-8 text-center">
    <div class="w-14 h-14 bg-green-100 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl" aria-hidden="true">✉️</div>
    <h2 class="text-lg font-bold text-gray-900 mb-2">Revisá tu correo</h2>
    <p class="text-sm text-gray-500 mb-6">Te enviamos un enlace a <strong>{{ current_user.email }}</strong>. Tocalo para activar tu cuenta (revisá también spam). Vence en 1 hora.</p>
    <form method="POST" action="{{ url_for('auth.resend_verification') }}" class="mb-3">
        {{ csrf_input() }}
        <button type="submit" class="w-full bg-green-600 text-white font-semibold py-3 rounded-xl hover:bg-green-700 transition-colors text-sm">Reenviar correo</button>
    </form>
    <form method="POST" action="{{ url_for('auth.logout') }}">
        {{ csrf_input() }}
        <button class="text-sm text-gray-500 hover:underline">Cerrar sesión</button>
    </form>
</div>
{% endblock %}
