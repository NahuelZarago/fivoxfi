<!DOCTYPE html>
<html><body style="font-family:-apple-system,'Segoe UI',sans-serif;background:#f9fafb;margin:0;padding:32px 16px;">
<div style="max-width:500px;margin:0 auto;background:#fff;border-radius:16px;border:1px solid #e5e7eb;overflow:hidden;">
  <div style="background:#1e8049;padding:24px 32px;color:#fff;font-size:20px;font-weight:800;">Fivox</div>
  <div style="padding:32px;">
    <h2 style="font-size:20px;color:#111827;margin:0 0 8px;">Hola, {{ username }}</h2>
    <p style="color:#6b7280;font-size:15px;line-height:1.6;margin:0 0 24px;">Gracias por registrarte en Fivox. Para activar tu cuenta, verificá tu dirección de email:</p>
    <a href="{{ url }}" style="display:block;background:#1e8049;color:#fff;text-align:center;padding:14px 24px;border-radius:12px;text-decoration:none;font-weight:700;margin-bottom:24px;">Verificar mi email</a>
    <p style="color:#6b7280;font-size:12px;word-break:break-all;margin:0 0 20px;">{{ url }}</p>
    <p style="color:#9ca3af;font-size:13px;border-top:1px solid #f3f4f6;padding-top:16px;margin:0;">Este enlace expira en <strong>1 hora</strong>. Si no creaste esta cuenta, ignorá este mensaje.</p>
  </div>
</div></body></html>
