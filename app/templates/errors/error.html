{% extends 'base_auth.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-8 text-center">
    <p class="text-5xl font-extrabold text-green-600 mb-2">{{ code }}</p>
    <h1 class="text-lg font-bold text-gray-900 mb-2">{{ title }}</h1>
    <p class="text-sm text-gray-500 mb-6">{{ message }}</p>
    <a href="{{ url_for('auth.home') if authenticated else url_for('public.index') }}"
       class="inline-block bg-green-600 text-white font-semibold px-5 py-2.5 rounded-xl hover:bg-green-700 text-sm">
        {{ 'Volver a mi panel' if authenticated else 'Ir al inicio' }}
    </a>
</div>
{% endblock %}
