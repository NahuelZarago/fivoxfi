name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: fivox, POSTGRES_PASSWORD: fivox, POSTGRES_DB: fivox_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fivox" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fivox:fivox@localhost:5432/fivox_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python tests/static_checks.py
      - run: python tests/render_check.py
      - run: pytest -q
      - name: Migraciones aplican sobre Postgres vacío
        env:
          APP_ENV: development
          SECRET_KEY: ci-secret-key
          DATABASE_URL: postgresql://fivox:fivox@localhost:5432/fivox_test
        run: |
          python -c "
          from sqlalchemy import create_engine, text
          e = create_engine('$DATABASE_URL'); c = e.connect(); c.execute(text('DROP SCHEMA public CASCADE; CREATE SCHEMA public;')); c.commit()"
          flask --app run db upgrade
